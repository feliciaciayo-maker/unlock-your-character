<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7C6CF2" />
  <meta name="description" content="A playful classroom self-reflection game about strengths, values, and identity." />
  <title>Unlock Your Character</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-shape bg-shape-one" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-two" aria-hidden="true"></div>
  <div class="bg-shape bg-shape-three" aria-hidden="true"></div>

  <main class="app-shell">
    <section class="game-card" aria-live="polite">
      <header class="topbar">
        <div class="brand-wrap">
          <span class="brand-mark" aria-hidden="true">✦</span>
          <div>
            <p id="levelLabel" class="eyebrow">WELCOME</p>
            <h1 class="brand">Unlock Your Character</h1>
          </div>
        </div>

        <div class="progress-wrap" aria-label="Quiz progress">
          <div class="progress-label">
            <span>Quest progress</span>
            <strong id="progressText">0%</strong>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>
      </header>

      <div id="screen"></div>
    </section>

    <footer>
      <p>Made for classroom reflection ✦ Your answers stay on this device.</p>
      <p class="footer-note">This activity is not a psychological test or diagnosis.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
