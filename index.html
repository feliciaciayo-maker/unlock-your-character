<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#6C63FF" />
  <title>Unlock Your Character</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app-shell">
    <section class="game-card" aria-live="polite">
      <div class="topbar">
        <div>
          <p id="levelLabel" class="eyebrow">WELCOME</p>
          <h1 class="brand">Unlock Your Character</h1>
        </div>
        <div class="progress-wrap" aria-label="Progress">
          <span id="progressText">0%</span>
          <div class="progress-track"><div id="progressBar" class="progress-bar"></div></div>
        </div>
      </div>

      <div id="screen"></div>
    </section>

    <footer>
      <p>This is a reflective activity, not a psychological diagnosis.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
